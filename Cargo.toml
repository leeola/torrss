[workspace]
resolver = "3"
members = [
  "lib",
  "bin",
]

[workspace.package]
edition = "2024"
publish = false
authors = ["Lee Olayvar <leegit@fastmail.com>"]
license-file = "LICENSE"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
rust_2018_idioms = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.dependencies]
async-trait = "0.1.91"
chrono = "0.4.45"
clap = "4.6.6"
feed-rs = "2.4.0"
qbit-rs = { version = "0.6.0", default-features = false, features = ["reqwest", "rustls-tls"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = "1.0.229"
serde_json = "1.0.151"
snafu = "0.9.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = "1.53.1"
topcoat = { version = "0.6.2", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.4", features = ["serde"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
